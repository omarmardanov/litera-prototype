<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litera.Studio — первый экран, вайрфрейм</title>

<!-- ВАЙРФРЕЙМ. Только структура первого экрана: где что стоит и какого размера.
     Ни цвета направлений, ни Raptor, ни картинок. Серое пятно в центре — место
     под раскладку предметов (вид сверху, тени в одну сторону), она делается
     отдельно генерацией и подставляется сюда. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }

  :root{
    --ink:#0b0b0d;
    --mute:#8a8a92;
    --edge:clamp(22px, 2.6vw, 42px);   /* поле листа, одно на весь экран */
  }

  html{ -webkit-text-size-adjust:100%; }
  body{ font:400 16px/1.5 'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
        color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale; }
  a{ color:inherit; text-decoration:none; }

  /* Первый экран — один лист: поля со всех сторон, три вещи внутри */
  .sheet{ min-height:100svh; padding:var(--edge);
        display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:clamp(20px,2.4vw,34px); }

  /* ── ШАПКА: одна строка, без плашек и подложек ─────────────────────── */
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
  .mark{ width:74px; height:34px; border:1px dashed #d4d4d8; display:grid; place-items:center;
        font-size:10px; letter-spacing:.04em; color:#a1a1aa; }
  .menu{ display:flex; gap:clamp(14px,1.6vw,26px); font-size:13.5px; color:#52525b; }
  .menu a:last-child{ font-weight:600; color:var(--ink); }

  /* ── ЗОНА РАСКЛАДКИ ───────────────────────────────────────────────────
     Предметы нанизаны на одну дугу: снизу слева вверх направо. В вайрфрейме
     это пустые слоты — важны только их размеры, наклон и общий контур. */
  .stage{ position:relative; }
  .slot{ position:absolute; border:1px dashed #d4d4d8; background:#fafafa; }
  .note{ position:absolute; left:0; top:0; font-size:11.5px; color:#a1a1aa;
        letter-spacing:.02em; }

  /* ── ПОДВАЛ ЛИСТА: метка и абзац в левом нижнем углу ───────────────── */
  .foot{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .say{ max-width:54ch; }
  .say .lbl{ display:block; margin-bottom:12px; font-size:11.5px; color:#a1a1aa; }
  /* Заголовок и продолжение набраны одинаково: читаются одним абзацем,
     но первая фраза остаётся h1 для поиска */
  .say h1, .say p{ display:inline; font-size:clamp(14.5px,1.1vw,16px); font-weight:400;
        line-height:1.5; letter-spacing:-.005em; }
  .foot .tel{ font-size:13.5px; color:#52525b; white-space:nowrap; }

  @media(max-width:820px){
    .sheet{ grid-template-rows:auto minmax(46svh,1fr) auto; }
    .menu{ gap:14px; font-size:12.5px; }
    .foot{ flex-direction:column; align-items:flex-start; gap:16px; }
    .say{ max-width:none; }
  }
</style>
</head>
<body>

<div class="sheet">

  <header class="top">
    <div class="mark">марка</div>
    <nav class="menu">
      <a href="#">Каталог</a>
      <a href="#">Работы</a>
      <a href="#">Студия</a>
      <a href="#">Обсудить задачу</a>
    </nav>
  </header>

  <section class="stage" id="stage">
    <span class="note">зона раскладки: 13 предметов, вид сверху, тени в одну сторону</span>
  </section>

  <footer class="foot">
    <div class="say">
      <span class="lbl">(Студия)</span>
      <h1>Студия дизайна и печати в Москве, своё производство с 2012 года.</h1>
      <p> Печатаем сложное: тиснение фольгой, объёмный лак, кашировка, вырубка.</p>
    </div>
    <a href="tel:+74950213577" class="tel">+7 (495) 021-35-77</a>
  </footer>

</div>

<script>
  // Слоты сидят на одной квадратичной кривой: левый край низко, правый уходит
  // вверх. Размеры разные, но контур массы один — иначе раскладка читается
  // свалкой, а не предметом.
  const stage = document.getElementById('stage');
  const P0 = {x:30, y:74}, P1 = {x:64, y:70}, P2 = {x:95, y:16};   // % от зоны

  // Слоты не выстроены в цепочку: каждый сдвинут поперёк оси, поэтому масса
  // набирает толщину и предметы перекрывают друг друга. Хвост слева тонкий
  // и мелкий, к правому краю масса плотнеет и укрупняется.
  const T    = [0,   .06, .13, .2,  .28, .36, .44, .52, .6,  .68, .76, .85, .94];
  const OFF  = [-2,   5,  -7,   2,   9,  -6,   4,  -9,   6,  -3,  10,  -7,   3];  // поперёк оси, %
  const SIZE = [ 7,   9,   8,  12,  10,  14,  11,  16,  13,  18,  14,  19,  15];  // ширина, %
  const RAT  = [1.2, .7, 1.05, .62, 1.3, .78, 1.0, .58, 1.25, .72, .95, .64, 1.1];// высота/ширина
  const TILT = [-16,  8, -21,  13,  -7,  19, -12,   5, -18,  11,  -4,  16,  -9];

  T.forEach((t, i) => {
    const k = (1 - t) * (1 - t);
    const x = k * P0.x + 2 * (1 - t) * t * P1.x + t * t * P2.x;
    const y = k * P0.y + 2 * (1 - t) * t * P1.y + t * t * P2.y;

    const el = document.createElement('div');
    el.className = 'slot';
    el.style.cssText =
      `left:${x}%; top:${y + OFF[i]}%; width:${SIZE[i]}%; aspect-ratio:${1 / RAT[i]};` +
      `transform:translate(-50%,-50%) rotate(${TILT[i]}deg);`;
    stage.appendChild(el);
  });
</script>

</body>
</html>
